services:
  - type: web
    name: asl-translator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: MEDIAPIPE_DISABLE_GPU
        value: "1"
