services:
  - type: web
    name: asl-translator
    env: python
    buildCommand: apt-get install -y libgl1 libglib2.0-0 libgles2 && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
