<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASL Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-theme="light"] {
      --bg:         #fffaf0;
      --surface:    #fdecd6;
      --surface2:   #fad9b0;
      --accent:     #c0580a;
      --accent-dk:  #a04608;
      --text:       #3d1f00;
      --muted:      #8a5a30;
      --border:     rgba(160,90,40,0.18);
      --border2:    rgba(160,90,40,0.10);
      --danger:     #c0392b;
      --cam-bg:     #1a0a00;
      --btn-bg:     #fff8ee;
      --btn-color:  #3d1f00;
    }

    [data-theme="dark"] {
      --bg:         #1e2340;
      --surface:    #2a3060;
      --surface2:   #3a4275;
      --accent:     #6d8196;
      --accent-dk:  #5a6d7e;
      --text:       #ffffe3;
      --muted:      #8fa3b1;
      --border:     rgba(143,163,177,0.18);
      --border2:    rgba(143,163,177,0.10);
      --danger:     #c97a6a;
      --cam-bg:     #0d1020;
      --btn-bg:     #1e2340;
      --btn-color:  #ffffe3;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 20px 48px; gap: 20px;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex; align-items: center; gap: 14px;
      width: 100%; max-width: 1140px;
      border-bottom: 1px solid var(--border); padding-bottom: 16px;
    }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px; background: var(--accent);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem;
    }

    h1 { font-family: 'Crimson Pro', serif; font-size: 1.6rem; font-weight: 600; color: var(--text); }
    h1 em { font-style: italic; color: var(--accent); }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

    .theme-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px; cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: 0.7rem;
      color: var(--muted); display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); animation: pulse 2.5s ease-in-out infinite;
    }
    .status-dot.offline { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .status-text { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

    .tabs {
      display: flex; gap: 4px; background: var(--surface);
      border-radius: 10px; padding: 4px; width: 100%; max-width: 1140px;
    }
    .tab {
      flex: 1; padding: 8px; border-radius: 7px; border: none;
      background: transparent; color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .tab.active { background: var(--surface2); color: var(--accent); }

    .panel { display: none; width: 100%; max-width: 1140px; }
    .panel.active { display: flex; gap: 20px; align-items: flex-start; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; transition: background 0.3s;
    }
    .card-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border2);
      font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; gap: 8px;
    }
    .card-body { padding: 16px; }

    .camera-col { flex: 1.5; display: flex; flex-direction: column; gap: 14px; }
    .camera-wrap { position: relative; }

    #camera-video {
      width: 100%; display: block; aspect-ratio: 16/9;
      object-fit: cover; background: var(--cam-bg);
      border-radius: 0;
    }
    #camera-video.flipped { transform: scaleX(-1); }

    #cam-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: var(--cam-bg);
    }
    #cam-placeholder.hidden { display: none; }
    .cam-placeholder-icon { font-size: 2.5rem; opacity: 0.5; }
    .cam-placeholder-text {
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.6; color: var(--muted);
    }

    .cam-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--btn-bg); color: var(--btn-color);
      font-family: 'DM Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .btn-accent:hover { background: var(--accent-dk); border-color: var(--accent-dk); color: #fff; }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn-active { border-color: var(--accent) !important; color: var(--accent) !important; }

    .right-col { flex: 1; display: flex; flex-direction: column; gap: 14px; }

    .letter-display {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px; padding: 20px 16px;
    }
    #predicted-letter {
      font-family: 'Crimson Pro', serif; font-size: 8rem; font-weight: 600;
      color: var(--accent); line-height: 1;
      transition: transform 0.1s ease; min-height: 1em;
      display: flex; align-items: center; justify-content: center;
    }
    #predicted-letter.flash { transform: scale(1.1); }
    .letter-sub { font-size: 0.6rem; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }

    .hold-bar-bg {
      width: 100%; height: 4px; background: var(--border);
      border-radius: 100px; overflow: hidden; margin-top: 4px;
    }
    #hold-progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--muted), var(--accent));
      border-radius: 100px; transition: width 0.05s linear;
    }

    .toggle-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    .toggle-label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; flex: 1; }
    .toggle { position: relative; width: 36px; height: 18px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: var(--border);
      border-radius: 100px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 12px; height: 12px;
      left: 3px; top: 3px; background: var(--muted); border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: rgba(192,88,10,0.25); }
    [data-theme="dark"] .toggle input:checked + .toggle-slider { background: rgba(109,129,150,0.3); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: var(--accent); }

    .text-output-area { display: flex; flex-direction: column; gap: 10px; }
    #text-output {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; min-height: 80px;
      font-family: 'Crimson Pro', serif; font-size: 1.5rem;
      color: var(--text); line-height: 1.5; word-break: break-word;
      white-space: pre-wrap; letter-spacing: 0.04em; transition: background 0.3s;
    }
    #text-output:empty::before { content: 'Start signing...'; color: var(--muted); font-style: italic; }
    .cursor {
      display: inline-block; width: 2px; height: 1.2em;
      background: var(--accent); vertical-align: text-bottom;
      margin-left: 1px; animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .output-btns { display: flex; gap: 8px; }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: 14px; padding: 48px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; transition: all 0.2s; background: var(--surface);
    }
    .upload-zone:hover { border-color: var(--accent); background: var(--surface2); }
    .upload-icon { font-size: 2.5rem; }
    .upload-text { font-family: 'Crimson Pro', serif; font-size: 1.1rem; color: var(--text); }
    .upload-sub { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
    #upload-input { display: none; }
    .upload-result { display: flex; gap: 20px; align-items: flex-start; }
    #upload-preview {
      width: 260px; border-radius: 10px; object-fit: cover;
      border: 1px solid var(--border); display: none;
    }
    .upload-prediction { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    #upload-letter { font-family: 'Crimson Pro', serif; font-size: 6rem; font-weight: 600; color: var(--accent); line-height: 1; }
    #upload-message { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; }

    canvas { display: none; }

    @media (max-width: 768px) {
      .panel.active { flex-direction: column; }
      .upload-result { flex-direction: column; }
      #upload-preview { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🤟</div>
      <h1>ASL <em>Translator</em></h1>
    </div>
    <div class="header-right">
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Dark</span>
      </button>
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">connecting...</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('live')">📷 Live Camera</button>
    <button class="tab" onclick="switchTab('upload')">🖼 Image Upload</button>
  </div>

  <!-- LIVE PANEL -->
  <div class="panel active" id="panel-live">
    <div class="camera-col">
      <div class="card camera-wrap">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="capture-canvas"></canvas>
        <div id="cam-placeholder">
          <div class="cam-placeholder-icon">📷</div>
          <div class="cam-placeholder-text">Turn on the camera to begin</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">📷 Camera Controls</div>
        <div class="card-body" style="display:flex; flex-direction:column; gap:10px;">
          <div class="cam-controls">
            <select id="cam-select" style="flex:1; min-width:120px; background:var(--btn-bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Mono',monospace; font-size:0.72rem; padding:8px 10px; cursor:pointer; outline:none;">
              <option value="">Scanning cameras...</option>
            </select>
            <button class="btn btn-accent" onclick="turnCameraOn()">Turn On</button>
            <button class="btn btn-danger" onclick="turnCameraOff()">Turn Off</button>
            <button class="btn" id="btn-flip" onclick="toggleFlip()">⇄ Flip</button>
          </div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <div class="card-header">✋ Detected Sign</div>
        <div class="letter-display">
          <div id="predicted-letter">—</div>
          <div class="letter-sub" id="letter-sub">no hand detected</div>
          <div class="hold-bar-bg"><div id="hold-progress"></div></div>
          <div class="toggle-row" style="margin-top:8px;">
            <span class="toggle-label">AUTO-ADD (hold sign 2.5s)</span>
            <label class="toggle">
              <input type="checkbox" id="auto-add-toggle" checked/>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">📝 Text Output</div>
        <div class="card-body text-output-area">
          <div id="text-output"><span class="cursor"></span></div>
          <div class="output-btns">
            <button class="btn btn-accent" onclick="addLetter()">+ Add Letter</button>
            <button class="btn" onclick="backspace()">⌫ Delete</button>
            <button class="btn btn-danger" onclick="clearAll()">✕ Clear</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- UPLOAD PANEL -->
  <div class="panel" id="panel-upload">
    <div style="width:100%; display:flex; flex-direction:column; gap:20px;">
      <div class="upload-zone" onclick="document.getElementById('upload-input').click()"
           ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <div class="upload-icon">📂</div>
        <div class="upload-text">Drop an image or click to browse</div>
        <div class="upload-sub">JPG, PNG, WEBP — shows the predicted ASL sign</div>
        <input type="file" id="upload-input" accept="image/*" onchange="handleFileSelect(event)"/>
      </div>
      <div class="upload-result" id="upload-result" style="display:none;">
        <img id="upload-preview" alt="Uploaded image"/>
        <div class="upload-prediction card" style="padding:24px;">
          <div class="card-header" style="padding:0; border:none;">Prediction</div>
          <div id="upload-letter">—</div>
          <div id="upload-message"></div>
          <button class="btn btn-accent" onclick="addUploadedLetter()" id="btn-add-upload"
                  style="display:none; margin-top:8px;">+ Add to Text Output</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Config — update this to your Render URL after deploying ──
    const SERVER = 'https://asl-translator-y48g.onrender.com';

    let currentLetter = '';
    let textContent   = '';
    let holdStart     = null;
    let holdLetter    = '';
    const HOLD_DURATION = 2500;
    let lastUploadLetter = '';
    let isDark   = false;
    let flipped  = false;
    let camStream = null;
    let predicting = false;

    // ── Theme ──
    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = isDark ? 'Light' : 'Dark';
    }

    // ── Tabs ──
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['live','upload'][i] === tab));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
    }

    // ── Camera ──
    async function scanCameras() {
      const sel = document.getElementById('cam-select');
      sel.innerHTML = '<option value="">Scanning...</option>';
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        sel.innerHTML = '';
        cams.forEach((cam, i) => {
          const opt = document.createElement('option');
          opt.value = cam.deviceId;
          opt.textContent = cam.label || (i === 0 ? 'Camera 0 (built-in)' : `Camera ${i} (external)`);
          sel.appendChild(opt);
        });
        if (cams.length === 0) sel.innerHTML = '<option>No cameras found</option>';
      } catch { sel.innerHTML = '<option>Camera access denied</option>'; }
    }

    async function turnCameraOn() {
      const sel = document.getElementById('cam-select');
      const deviceId = sel.value;
      try {
        if (camStream) camStream.getTracks().forEach(t => t.stop());
        const constraints = deviceId
          ? { video: { deviceId: { exact: deviceId }, width: 640, height: 480 } }
          : { video: { width: 640, height: 480 } };
        camStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('camera-video');
        video.srcObject = camStream;
        document.getElementById('cam-placeholder').classList.add('hidden');
        setStatus(true);
        startPredicting();
        // Re-scan so labels show properly
        await scanCameras();
      } catch(e) {
        alert('Could not access camera: ' + e.message);
      }
    }

    function turnCameraOff() {
      predicting = false;
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
      const video = document.getElementById('camera-video');
      video.srcObject = null;
      document.getElementById('cam-placeholder').classList.remove('hidden');
      document.getElementById('predicted-letter').textContent = '—';
      document.getElementById('letter-sub').textContent = 'camera off';
      document.getElementById('hold-progress').style.width = '0%';
      currentLetter = '';
      setStatus(false);
    }

    function toggleFlip() {
      flipped = !flipped;
      document.getElementById('camera-video').classList.toggle('flipped', flipped);
      document.getElementById('btn-flip').classList.toggle('btn-active', flipped);
    }

    // ── Frame capture & prediction ──
    function startPredicting() {
      predicting = true;
      requestAnimationFrame(captureLoop);
    }

    async function captureLoop() {
      if (!predicting) return;
      const video  = document.getElementById('camera-video');
      const canvas = document.getElementById('capture-canvas');
      if (video.readyState === 4) {
        canvas.width  = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        if (flipped) {
          ctx.translate(320, 0); ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, 320, 240);
        const frame = canvas.toDataURL('image/jpeg', 0.6);
        try {
          const res  = await fetch(`${SERVER}/predict_frame`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ frame })
          });
          const data = await res.json();
          setStatus(true);
          updateLetter(data.letter || '');
        } catch { setStatus(false); }
      }
      setTimeout(() => requestAnimationFrame(captureLoop), 150);
    }

    // ── Status ──
    function setStatus(online) {
      document.getElementById('status-dot').className  = 'status-dot' + (online ? '' : ' offline');
      document.getElementById('status-text').textContent = online ? 'live' : 'offline';
    }

    // ── Letter display ──
    function updateLetter(letter) {
      if (letter === currentLetter) {
        // Same letter — update hold progress
        const autoAdd = document.getElementById('auto-add-toggle').checked;
        if (autoAdd && letter) {
          if (holdLetter !== letter) { holdStart = Date.now(); holdLetter = letter; }
          const elapsed = Date.now() - holdStart;
          document.getElementById('hold-progress').style.width = Math.min(elapsed / HOLD_DURATION * 100, 100) + '%';
          if (elapsed >= HOLD_DURATION) { addLetter(); holdStart = Date.now(); }
        } else {
          document.getElementById('hold-progress').style.width = '0%';
        }
        return;
      }
      currentLetter = letter;
      holdStart = null; holdLetter = '';
      document.getElementById('hold-progress').style.width = '0%';
      const el  = document.getElementById('predicted-letter');
      const sub = document.getElementById('letter-sub');
      if (!letter) { el.textContent = '—'; sub.textContent = 'no hand detected'; return; }
      el.textContent  = letter === ' ' ? '␣' : letter;
      sub.textContent = letter === ' ' ? 'space' : `sign: ${letter}`;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 200);
    }

    // ── Text output ──
    function renderText() {
      const el = document.getElementById('text-output');
      if (!textContent) { el.innerHTML = '<span class="cursor"></span>'; return; }
      const escaped = textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      el.innerHTML = escaped + '<span class="cursor"></span>';
    }
    function addLetter()  { if (!currentLetter) return; textContent += currentLetter; renderText(); }
    function backspace()  { textContent = textContent.slice(0,-1); renderText(); }
    function clearAll()   { textContent = ''; renderText(); }

    // ── Image upload ──
    function handleDragOver(e)  { e.preventDefault(); e.currentTarget.style.borderColor = 'var(--accent)'; }
    function handleDragLeave(e) { e.currentTarget.style.borderColor = ''; }
    function handleDrop(e) { e.preventDefault(); e.currentTarget.style.borderColor = ''; processUpload(e.dataTransfer.files[0]); }
    function handleFileSelect(e) { processUpload(e.target.files[0]); }

    async function processUpload(file) {
      if (!file) return;
      const preview = document.getElementById('upload-preview');
      preview.src = URL.createObjectURL(file); preview.style.display = 'block';
      document.getElementById('upload-result').style.display = 'flex';
      document.getElementById('upload-letter').textContent  = '...';
      document.getElementById('upload-message').textContent = 'Analyzing...';
      document.getElementById('btn-add-upload').style.display = 'none';
      const formData = new FormData(); formData.append('image', file);
      try {
        const res  = await fetch(`${SERVER}/predict_image`, { method:'POST', body:formData });
        const data = await res.json();
        if (data.error || !data.letter) {
          document.getElementById('upload-letter').textContent  = '?';
          document.getElementById('upload-message').textContent = data.message || data.error || 'No hand detected';
        } else {
          lastUploadLetter = data.letter;
          document.getElementById('upload-letter').textContent  = data.display;
          document.getElementById('upload-message').textContent = `Predicted sign: ${data.display}`;
          document.getElementById('btn-add-upload').style.display = 'block';
        }
      } catch {
        document.getElementById('upload-letter').textContent  = '✗';
        document.getElementById('upload-message').textContent = 'Server offline';
      }
    }

    function addUploadedLetter() {
      if (!lastUploadLetter) return;
      textContent += lastUploadLetter; renderText(); switchTab('live');
    }

    // ── Init ──
    navigator.mediaDevices.getUserMedia({video:true})
      .then(s => { s.getTracks().forEach(t => t.stop()); scanCameras(); })
      .catch(() => scanCameras());
    renderText();
  </script>

</body>
</html>
